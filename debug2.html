<!DOCTYPE html>
<html><head><title>SmartTable Debug v2</title></head>
<body>
<div id="result">Loading...</div>
<div id="app"></div>
<script>
var r = document.getElementById('result');

window.addEventListener('error', function(e) {
  r.innerHTML += '<br>JS ERROR: ' + e.message + '<br>File: ' + e.filename + '<br>Line: ' + e.lineno + ':' + e.colno + '<br>';
});

window.addEventListener('unhandledrejection', function(e) {
  r.innerHTML += '<br>UNHANDLED REJECTION: ' + e.reason + '<br>';
});
</script>
<script src="js/config.js?v=20260828d2"></script>
<script>r.innerHTML += 'config: ' + (typeof CONFIG) + '<br>';</script>
<script src="js/i18n.js?v=20260828d2"></script>
<script>r.innerHTML += 'i18n: ' + (typeof I18n) + '<br>';</script>
<script src="js/supabase.js?v=20260828d2"></script>
<script>r.innerHTML += 'supabase: ' + (typeof Supabase) + '<br>';</script>
<script src="js/auth.js?v=20260828d2"></script>
<script>r.innerHTML += 'auth: ' + (typeof Auth) + '<br>';</script>
<script src="js/utils.js?v=20260828d2"></script>
<script>r.innerHTML += 'utils: ' + (typeof Utils) + '<br>';</script>
<script src="js/kiosk.js?v=20260828d2"></script>
<script>r.innerHTML += 'kiosk: ' + (typeof KioskLock) + '<br>';</script>
<script src="js/screens/landing.js?v=20260828d2"></script>
<script>r.innerHTML += 'landing: ' + (typeof LandingScreen) + '<br>';</script>
<script src="js/screens/register.js?v=20260828d2"></script>
<script>r.innerHTML += 'register: ' + (typeof RegisterScreen) + '<br>';</script>
<script src="js/screens/customer.js?v=20260828d2"></script>
<script>r.innerHTML += 'customer: ' + (typeof CustomerScreen) + '<br>';</script>
<script src="js/screens/waiter.js?v=20260828d2"></script>
<script>r.innerHTML += 'waiter: ' + (typeof WaiterScreen) + '<br>';</script>
<script src="js/screens/manager.js?v=20260828d2"></script>
<script>r.innerHTML += 'manager: ' + (typeof ManagerScreen) + '<br>';</script>
<script src="js/screens/admin.js?v=20260828d2"></script>
<script>r.innerHTML += 'admin: ' + (typeof AdminScreen) + '<br>';</script>
<script src="js/screens/superadmin.js?v=20260828d2"></script>
<script>r.innerHTML += 'superadmin: ' + (typeof SuperAdminScreen) + '<br>';</script>
<script src="js/app.js?v=20260828d2"></script>
<script>r.innerHTML += 'app: ' + (typeof App) + '<br>';</script>
<script>
r.innerHTML += '<br>=== Attempting App.init() ===<br>';
try {
  App.init();
  r.innerHTML += 'App.init() called successfully<br>';
  r.innerHTML += 'app div innerHTML length: ' + document.getElementById('app').innerHTML.length + '<br>';
} catch(e) {
  r.innerHTML += 'App.init() ERROR: ' + e.message + '<br>Stack: ' + e.stack + '<br>';
}
</script>
</body>
</html>
